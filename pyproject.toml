[project]
name = "jobagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "duckdb>=1.1"]
analytics = ["dbt-duckdb>=1.9"]
brain = ["cursor-sdk"]

[project.scripts]
jobagent = "jobagent.cli:main"
jobagent-mcp = "jobagent.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.ruff]
line-length = 110
